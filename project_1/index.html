      <!-- form -->
      <section>
        <h2>Tell Us About Your Cat!</h2>
        <form action="https://freecatphotoapp.com/submit-cat-photo">
          <fieldset>
            <legend>Is your cat an indoor or outdoor cat?</legend>
            <label
              ><input
                id="indoor"
                type="radio"
                name="indoor-outdoor"
                value="indoor"
                checked
              />
              Indoor</label
            >
            <label
              ><input
                id="outdoor"
                type="radio"
                name="indoor-outdoor"
                value="outdoor"
              />
              Outdoor</label
            >
          </fieldset>
          <fieldset>
            <legend>What is your cat like?</legend>
            <input
              id="loving"
              type="checkbox"
              name="personality"
              value="loving"
              checked
            />
            <label for="loving">Loving</label>
            <input id="lazy" type="checkbox" name="personality" value="lazy" />
            <label for="lazy">Lazy</label>
            <input id="energetic"
            <input id="energetic" type="checkbox" name="personality" value="energetic" />
            <label for="energetic">Energetic</label>
            <input id="insane" type="checkbox" name="personality" value="insane" />
            <label for="insane">Insane</label>
            <input id="the cutest" type="checkbox" name="personality" value="the cutest" required />
            <label for="the cutest">The Cutest</label>
            <input id="sassy" type="checkbox" name="personality" value="sassy" />
            <label for="naughty">Sassy</label>
            <input id="naught" type="checkbox" name="personality" value="naughty" />
            <label for="naughty">Naughty</label>
          </fieldset>
          <input type="text-box" name="about-me" id="about-me" placeholder="anything else we missed" size="100px"
          >
          <br>
          <input
            type="text"
            name="catphotourl"
            placeholder="cat photo URL"
            required
          />
          <button type="submit">Submit</button>
        </form>
      </section>
